
name: Frontend CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user_example
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: db_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user_example -d db_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: user_example
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: db_example
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      VITE_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: |
          poetry config virtualenvs.create false
          poetry install --only main --no-root

      - name: Apply database migrations
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Start FastAPI
        working-directory: backend
        run: |
          nohup poetry run uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > /tmp/api.log 2>&1 &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/users; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/api.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/api.log || true
