name: CI - Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint-and-format:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --no-root

      - name: Check Formatting
        run: poetry run ruff format --check .

      - name: Lint Code
        run: poetry run ruff check .

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: user_example
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_DB: db_example
      POSTGRES_TEST_DB: db_example_test
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user_example
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: db_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user_example -d db_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create test database
        run: psql --host=localhost --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command="CREATE DATABASE $POSTGRES_TEST_DB;"
        env:
          PGPASSWORD: test_password

      - name: Run tests
        run: poetry run pytest
      
