services:
  db: 
    image: postgres:16-alpine
    container_name: c216_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user_example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-db_example}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-db_example_test}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - c216_db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: c216_api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_USER: ${POSTGRES_USER:-user_example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_DB: ${POSTGRES_DB:-db_example}
      POSTGRES_PORT: ${POSTGRES_PORT:-5435}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${API_PORT}:8000"

volumes:
  c216_db_data:
